services:
  app:
    build:
      context: .
    image: frosthaven-deck-builder:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${HOST_IP:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      DATA_DIR: "${DATA_DIR:-/data}"
    volumes:
      - ./data:${DATA_DIR:-/data}
