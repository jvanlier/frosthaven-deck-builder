<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Field Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#23201b;--mut:#7a7166;--line:#e3dacb;--acc:#2f5d8a;--acc2:#e8eef5;--ok:#2f7d4f;--warn:#b7791f;--bad:#b23a3a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;background:#efe8da}
aside .brand{font-family:Fraunces,serif;font-size:20px;font-weight:700;margin-bottom:2px}
aside small{color:var(--mut)}
aside h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:24px 0 8px}
.build{padding:8px 10px;border-radius:8px;margin-bottom:2px}.build.on{background:var(--card);box-shadow:0 1px 0 var(--line)}
.timeline{list-style:none;padding:0;margin:0;position:relative}
.timeline:before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--line)}
.timeline li button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 4px;border-radius:8px;position:relative}
.timeline li button:hover{background:#fff6}
.node{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;z-index:1}
.on .node{background:var(--acc);border-color:var(--acc);color:#fff}
.future .node{border-style:dashed}.future{color:var(--mut)}
.timeline .sub{font-size:12px;color:var(--mut)}
.navlinks button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px}
.navlinks button.on{background:var(--card);font-weight:600}
main{padding:28px 36px 60px;max-width:1080px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-size:34px}
.badge{font-size:12px;padding:3px 9px;border-radius:4px;border:1px solid currentColor;font-weight:600}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}
.meta{color:var(--mut);margin-bottom:22px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--card);padding:7px 12px}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child{border:0}
.item img{width:56px;border-radius:5px;display:block;box-shadow:0 1px 3px #0002}
.item .nm{font-weight:600}.item .sub{color:var(--mut);font-size:13px}
.item .g{grid-column:2/4;font-size:14px;line-height:1.5;color:#4a443c;border-left:3px solid var(--acc2);padding-left:10px;margin-top:-2px}
.item .g.empty{color:var(--mut);font-style:italic}
.init{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--acc2);color:var(--acc);padding:2px 7px;border-radius:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gallery button{border:0;background:none;padding:0}.gallery img{width:100%;border-radius:8px;display:block;box-shadow:0 2px 8px #0002}
.journal{margin-top:30px}
.journal h2{font-size:22px;margin-bottom:10px}
.entry{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:14px 0;border-top:1px dashed var(--line)}
.entry .kind{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.kind.add,.kind.pick{color:var(--ok)}.kind.drop{color:var(--bad)}.kind.exclude{color:var(--mut)}
.entry blockquote{margin:4px 0 0;font-family:Fraunces,serif;font-size:17px;line-height:1.45;font-weight:500}
.entry .addnote{color:var(--mut);border:0;background:none;padding:0;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
/* wizard */
.steps{display:flex;gap:0;margin:8px 0 22px;counter-reset:s}
.step{flex:1;padding:10px 12px;border-bottom:3px solid var(--line);color:var(--mut);font-size:14px}
.step b{display:block;font-family:Fraunces,serif;font-size:16px;color:var(--ink)}
.step.on{border-color:var(--acc)}.step.done{border-color:var(--ok)}
.lu{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.deckpanel{position:sticky;top:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.counter{font-family:Fraunces,serif;font-size:22px;font-weight:700;margin-bottom:2px}
.counter.warn{color:var(--warn)}.counter.ok{color:var(--ok)}
.mini{list-style:none;padding:0;margin:10px 0 0}
.mini li button{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:4px 6px;border-radius:6px;text-align:left}
.mini li button:hover{background:var(--paper)}
.mini img{width:28px;border-radius:3px}
.mini .x{font-size:12px;color:var(--mut)}
.mini .dropped{text-decoration:line-through;color:var(--mut)}.mini .dropped .x{color:var(--bad);font-weight:600}
.mini .isnew .nm:after{content:" NEW";font-size:10px;color:var(--ok);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:left;display:grid;grid-template-columns:110px 1fr;gap:12px}
.opt img{width:110px;border-radius:6px}
.opt[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:inline-block;vertical-align:-3px;margin-right:6px}
.opt[aria-pressed=true] .radio{border:6px solid var(--acc)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:26px 0 10px}
.opts.small{grid-template-columns:repeat(3,1fr)}.opts.small .opt{grid-template-columns:60px 1fr}.opts.small img{width:60px}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;font:inherit;min-height:60px}
/* matrix */
table{border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:5px 10px;border-bottom:1px solid var(--line)}
thead th{font-family:Fraunces,serif;font-size:15px;background:#efe8da}
thead th button{border:0;background:none;font:inherit;color:var(--acc);text-decoration:underline;text-underline-offset:3px}
td.c{text-align:center}
.sq{display:inline-block;width:22px;height:22px;border-radius:4px;vertical-align:middle;position:relative;font-size:11px;line-height:22px;font-weight:600;text-align:center}
.sq.d{background:var(--acc);color:#fff}.sq.p{border:1.5px solid var(--acc);color:var(--acc)}.sq.n{background:repeating-linear-gradient(45deg,#eee6d8 0 3px,transparent 3px 6px)}
.sq .dot{position:absolute;right:-5px;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--card)}
tr.g td{background:var(--paper);font-family:Fraunces,serif;font-weight:700;font-size:13px;color:var(--mut)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-bottom:14px;align-items:center}
dialog{border:0;border-radius:14px;padding:24px;max-width:720px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#23201b88}
.dlg{display:grid;grid-template-columns:260px 1fr;gap:22px}.dlg img{width:100%;border-radius:10px}
.mobilebar{display:none}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}main{min-width:0}aside{display:none}main{padding:16px 14px 90px}
  .head h1{font-size:26px}.lu{grid-template-columns:minmax(0,1fr)}.steps .step{padding:8px 4px;font-size:12px}.steps .step b{font-size:14px}.mini{display:grid;grid-template-columns:1fr 1fr}.mini li button{grid-template-columns:22px 1fr;font-size:13px}.mini .x{display:none}.mini img{width:22px}.deckpanel{position:sticky;top:0;z-index:3;order:-1;max-height:42vh;overflow:auto}
  .opts{grid-template-columns:minmax(0,1fr)}.opts.small{grid-template-columns:1fr 1fr}.dlg{grid-template-columns:1fr}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#efe8da;border-top:1px solid var(--line);padding:8px;gap:6px;overflow-x:auto;z-index:5}
  .mobilebar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;white-space:nowrap}.mobilebar button.on{background:var(--ink);color:var(--paper)}
}
</style></head><body>
<div class="app">
<aside>
  <div class="brand">Deck Journal</div><small>Snowdancer · hand of 11</small>
  <h4>Builds</h4>
  <div class="build on"><b>Freeze control</b><br><small>Start L3 · planned to L6</small></div>
  <div class="build"><b>Push & pull</b><br><small>Start L1 · planned to L4</small></div>
  <button class="btn" style="width:100%;margin-top:8px">+ New build</button>
  <h4>Levels</h4><ul class="timeline" id="tl"></ul>
  <h4>Views</h4><div class="navlinks" id="nav"></div>
</aside>
<main id="main"></main>
</div>
<div class="mobilebar" id="mb"></div>
<dialog id="dlg"></dialog>
<script src="cards.js"></script><script src="data.js"></script>
<script>
let screen = location.hash.slice(1) || "deck", L = MAX, view = "list";
const $ = s => document.querySelector(s);
const img = id => `<img src="${C[id].img}" alt="${esc(C[id].name)}, level ${C[id].level}">`;
const summary = l => { const c = changes(l); return c.start ? "Starting deck" : `+ ${C[c.pick].name}${c.dropped.length > 1 ? ` · ${c.dropped.length} swaps` : ""}`; };

function chrome() {
  $("#tl").innerHTML = LEVELS.map(l => `<li><button class="${l === L && screen === "deck" ? "on" : ""}" data-l="${l}"><span class="node">${l}</span><span>Level ${l}<div class="sub">${esc(summary(l))}</div></span></button></li>`).join("")
    + `<li><button class="future ${screen === "levelup" ? "on" : ""}" data-s="levelup"><span class="node">${MAX + 1}</span><span>Level up…</span></button></li>`;
  const v = [["deck", "Deck"], ["levelup", "Level up"], ["overview", "Overview"], ["notes", "All motivations"]];
  $("#nav").innerHTML = v.map(([k, n]) => `<button class="${screen === k ? "on" : ""}" data-s="${k}">${n}</button>`).join("");
  $("#mb").innerHTML = LEVELS.map(l => `<button class="${l === L && screen === "deck" ? "on" : ""}" data-l="${l}">L${l}</button>`).join("") + v.slice(1).map(([k, n]) => `<button class="${screen === k ? "on" : ""}" data-s="${k}">${n}</button>`).join("");
}
function journal(l) {
  const c = changes(l); const rows = [];
  if (c.start) { BUILD.startPicks.forEach(p => rows.push(["pick", `L${p.forLevel} pick`, p.cardId, motivation(l, p.cardId, "add")]));
    pool(l).filter(id => !deck(l).includes(id)).forEach(id => rows.push(["exclude", "Left out", id, motivation(l, id, "exclude")])); }
  else { c.added.forEach(a => rows.push(["add", a === c.pick ? "Picked" : "Added", a, motivation(l, a, "add")])); c.dropped.forEach(d => rows.push(["drop", "Dropped", d, motivation(l, d, "drop")])); }
  return `<section class="journal"><h2>${c.start ? "Why this starting deck" : `What changed at level ${l}`}</h2>${rows.map(([k, lab, id, m]) =>
    `<div class="entry"><div><div class="kind ${k}">${lab}</div><div class="mono" style="color:var(--mut)">${C[id].init}</div></div><div><b>${esc(C[id].name)}</b>${m ? `<blockquote>“${esc(m)}”</blockquote>` : `<br><button class="addnote">add a note</button>`}</div></div>`).join("")}</section>`;
}
function deckScreen() {
  const d = deck(L), c = changes(L);
  return `<div class="head"><h1>Level ${L}</h1><span class="badge ${d.length === HAND ? "ok" : "warn"}">${d.length === HAND ? "Complete" : "Incomplete"} · ${d.length}/${HAND}</span></div>
  <div class="meta">Freeze control · ${esc(summary(L))}</div>
  <div class="toolbar"><div class="seg"><button data-v="list" aria-pressed="${view === "list"}">List + guidance</button><button data-v="cards" aria-pressed="${view === "cards"}">Cards</button></div>
    <span class="spacer"></span><button class="btn">Edit level</button>${L === MAX ? `<button class="btn primary" data-s="levelup">Level up → ${MAX + 1}</button>` : ""}</div>
  ${view === "list" ? `<div class="list">${d.map(id => `<div class="item"><button data-c="${id}" style="border:0;background:none;padding:0">${img(id)}</button>
     <div><div class="nm">${esc(C[id].name)} ${c.added.includes(id) ? `<span class="badge ok" style="font-size:10px;padding:1px 5px">new</span>` : ""}</div><div class="sub">Level ${C[id].level}</div></div><span class="init">${String(C[id].init).padStart(2, "0")}</span>
     <div class="g ${BUILD.guidance[id] ? "" : "empty"}">${esc(BUILD.guidance[id] || "No guidance yet — open card to write some.")}</div></div>`).join("")}</div>`
    : `<div class="gallery">${d.map(id => `<button data-c="${id}">${img(id)}</button>`).join("")}</div>`}
  ${journal(L)}`;
}
function levelupScreen() {
  const ins = LU.instruction(), w = LU.working(), n = LU.count();
  const step = !LU.pick ? 1 : n > HAND ? 2 : 3;
  const opt = (id, small) => `<button class="opt" data-pick="${id}" aria-pressed="${LU.pick === id}">${img(id)}<div><span class="radio"></span><b>${esc(C[id].name)}</b><div class="mono" style="color:var(--mut);margin-top:4px">Lvl ${C[id].level} · init ${C[id].init}</div>${!small && BUILD.guidance[id] ? `<p>${esc(BUILD.guidance[id])}</p>` : ""}</div></button>`;
  return `<div class="head"><h1>Level ${LU.from} → ${LU.to}</h1></div><div class="meta">Freeze control · planning ahead is fine, nothing is permanent.</div>
  <div class="steps"><div class="step ${step > 1 ? "done" : "on"}">Step 1<b>Pick a card</b></div><div class="step ${step > 2 ? "done" : step === 2 ? "on" : ""}">Step 2<b>Drop a card</b></div><div class="step ${step === 3 ? "on" : ""}">Step 3<b>Notes &amp; done</b></div></div>
  <div class="lu"><div>
    <div class="sec">Newly unlocked at level ${LU.to}</div><div class="opts">${LU.newly().map(id => opt(id)).join("")}</div>
    <div class="sec">Earlier, not yet picked</div><div class="opts small">${LU.earlier().map(id => opt(id, 1)).join("")}</div>
    ${LU.pick ? `<div class="sec">Why ${esc(C[LU.pick].name)}? (optional)</div><textarea placeholder="Write a note, or skip it."></textarea>` : ""}
    ${LU.dropped.map(id => `<div class="sec">Why drop ${esc(C[id].name)}? (optional)</div><textarea></textarea>`).join("")}
    <details style="margin-top:22px"><summary>Swap more cards from your pool</summary><div class="opts small" style="margin-top:10px">${LU.swapIns().map(id => `<button class="opt" data-extra="${id}">${img(id)}<div><b>${esc(C[id].name)}</b><div class="mono">+ add to deck</div></div></button>`).join("")}</div></details>
  </div>
  <div class="deckpanel"><div class="counter ${ins.tone}">${n} / ${HAND}</div><div style="color:var(--mut);font-size:14px">${ins.text}</div>
    <ul class="mini">${w.map(id => { const dr = LU.dropped.includes(id); return `<li><button data-drop="${id}" class="${dr ? "dropped" : ""} ${id === LU.pick || LU.extra.includes(id) ? "isnew" : ""}">${img(id)}<span class="nm">${esc(C[id].name)}</span><span class="x">${dr ? "dropped ↺" : "drop"}</span></button></li>`; }).join("")}</ul>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="reset">Reset</button><button class="btn primary" style="flex:1" ${ins.tone === "ok" ? "" : "disabled"}>Done</button></div></div>
  </div>`;
}
function overviewScreen() {
  const groups = ["1", "X", "2", "3", "4", "5", "6", "7", "8", "9"];
  return `<div class="head"><h1>Overview</h1></div><div class="meta">Freeze control · every card across every level</div>
  <div class="legend"><span><span class="sq d"></span> in deck</span><span><span class="sq p"></span> in pool</span><span><span class="sq n"></span> not owned</span><span>★ picked · + added · − dropped</span><span><span class="sq p" style="border:0"><span class="dot"></span></span> has note</span></div>
  <div style="overflow-x:auto"><table><thead><tr><th style="text-align:left">Card</th><th>Init</th>${LEVELS.map(l => `<th><button data-l="${l}">L${l}</button></th>`).join("")}</tr></thead><tbody>
  ${groups.map(g => `<tr class="g"><td colspan="${LEVELS.length + 2}">Level ${g}</td></tr>` + sortIds(CARDS.filter(c => c.level === g).map(c => c.id)).map(id => `<tr><td>${esc(C[id].name)}</td><td class="c mono">${C[id].init}</td>${LEVELS.map(l => { const s = cellState(id, l);
      return `<td class="c"><span class="sq ${s.inDeck ? "d" : s.inPool ? "p" : "n"}" title="${s.inDeck ? "In deck" : s.inPool ? "In pool" : "Not in pool"}">${s.picked ? "★" : s.added ? "+" : s.dropped ? "−" : ""}${s.note ? `<span class="dot"></span>` : ""}</span></td>`; }).join("")}</tr>`).join("")).join("")}
  <tr><td><i>Summary</i></td><td></td>${LEVELS.map(l => { const c = changes(l); return `<td class="c" style="font-size:12px;color:var(--mut)">${c.start ? "start" : `${c.dropped.length} swap${c.dropped.length > 1 ? "s" : ""}`}</td>`; }).join("")}</tr>
  </tbody></table></div>`;
}
function notesScreen() { return `<div class="head"><h1>All motivations</h1></div><div class="meta">Only the reasons that still apply to this build are shown.</div>` + LEVELS.map(journal).join(""); }
function openCard(id) {
  const ms = Object.entries(BUILD.motivations).filter(([k]) => k.split("|")[1] === id);
  $("#dlg").innerHTML = `<div class="dlg">${img(id)}<div><h2>${esc(C[id].name)}</h2><div class="mono" style="color:var(--mut)">Level ${C[id].level} · initiative ${C[id].init}</div>
    <div class="sec">Guidance · Freeze control</div><textarea style="min-height:120px">${esc(BUILD.guidance[id] || "")}</textarea>
    <div class="sec">Motivations</div>${ms.map(([k, t]) => { const [l, , kind] = k.split("|"); return `<div class="entry" style="grid-template-columns:70px 1fr"><div class="kind ${kind}">${kind} L${l}</div><blockquote style="font-size:15px">${esc(t || "—")}</blockquote></div>`; }).join("") || "<i>None yet</i>"}
    <button class="btn" style="margin-top:14px" onclick="dlg.close()">Close</button></div></div>`;
  $("#dlg").showModal();
}
function render() { location.hash = screen; chrome(); $("#main").innerHTML = { deck: deckScreen, levelup: levelupScreen, overview: overviewScreen, notes: notesScreen }[screen](); }
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.l) { L = +d.l; screen = "deck"; } else if (d.s) screen = d.s; else if (d.v) view = d.v;
  else if (t.id === "reset") LU.reset(); else if (d.pick) LU.choose(d.pick); else if (d.drop) LU.toggleDrop(d.drop); else if (d.extra) LU.addExtra(d.extra);
  else if (d.c) return openCard(d.c); else return;
  render();
});
render();
</script></body></html>
